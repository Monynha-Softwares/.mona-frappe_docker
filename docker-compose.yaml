version: '3.8'
services:
  backend:
    image: 'frappe/erpnext:${FRAPPE_TAG:-v15.88.0}'
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'
    environment:
      DB_HOST: '${DB_HOST:-db}'
      DB_PORT: '${DB_PORT:-3306}'
      MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD}'
      MARIADB_ROOT_PASSWORD: '${DB_ROOT_PASSWORD}'
      FRAPPE_REDIS_CACHE: 'redis://redis-cache:6379'
      FRAPPE_REDIS_QUEUE: 'redis://redis-queue:6379'
  configurator:
    image: 'frappe/erpnext:${FRAPPE_TAG:-v15.88.0}'
    entrypoint:
      - bash
      - '-c'
    command: "ls -1 apps > sites/apps.txt; bench set-config -g db_host $$DB_HOST; bench set-config -gp db_port $$DB_PORT; bench set-config -g redis_cache \"redis://$$REDIS_CACHE\"; bench set-config -g redis_queue \"redis://$$REDIS_QUEUE\"; bench set-config -g redis_socketio \"redis://$$REDIS_QUEUE\"; bench set-config -gp socketio_port $$SOCKETIO_PORT;\n"
    environment:
      DB_HOST: '${DB_HOST:-db}'
      DB_PORT: '${DB_PORT:-3306}'
      REDIS_CACHE: '${REDIS_CACHE_HOST:-redis-cache:6379}'
      REDIS_QUEUE: '${REDIS_QUEUE_HOST:-redis-queue:6379}'
      SOCKETIO_PORT: '${SOCKETIO_PORT:-9000}'
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'
  create-site:
    image: frappe/erpnext:${FRAPPE_TAG:-v15.88.0}
    entrypoint: [ "bash", "-c" ]
    command: >
      wait-for-it --host=db --port=3306 --timeout=120 -- echo "db up";
      wait-for-it --host=redis-cache --port=6379 --timeout=120 -- echo "redis-cache up";
      wait-for-it --host=redis-queue --port=6379 --timeout=120 -- echo "redis-queue up";
      export start=`date +%s`;
      until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] &&
            [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] &&
            [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
      do
        echo "Waiting for sites/common_site_config.json to be created";
        sleep 5;
        if (( `date +%s`-start > 120 )); then
          echo "could not find sites/common_site_config.json with required keys";
          exit 1;
        fi
      done;
      echo "sites/common_site_config.json found";
      bench new-site
        --mariadb-user-host-login-scope='%'
        --admin-password=$$ADMIN_PASSWORD
        --db-root-username=root
        --db-root-password=$$DB_ROOT_PASSWORD
        --install-app erpnext
        --set-default $$PRIMARY_SITE;
    environment:
      PRIMARY_SITE: ${PRIMARY_SITE:-erp.boteco.pt}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
  db:
    image: 'mariadb:${MARIADB_TAG:-10.6}'
    command:
      - '--character-set-server=utf8mb4'
      - '--collation-server=utf8mb4_unicode_ci'
      - '--skip-character-set-client-handshake'
      - '--skip-innodb-read-only-compressed'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD}'
      MARIADB_ROOT_PASSWORD: '${DB_ROOT_PASSWORD}'
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - '-h'
        - localhost
        - '--password=${DB_ROOT_PASSWORD}'
      interval: 3s
      retries: 20
    volumes:
      - 'db-data:/var/lib/mysql'
  frontend:
    image: 'frappe/erpnext:${FRAPPE_TAG:-v15.88.0}'
    depends_on:
      - websocket
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: '${BACKEND_UPSTREAM:-backend:8000}'
      FRAPPE_SITE_NAME_HEADER: '${PRIMARY_SITE:-erp.boteco.pt}'
      SOCKETIO: '${SOCKETIO_UPSTREAM:-websocket:9000}'
      UPSTREAM_REAL_IP_ADDRESS: '${UPSTREAM_REAL_IP_ADDRESS:-127.0.0.1}'
      UPSTREAM_REAL_IP_HEADER: '${UPSTREAM_REAL_IP_HEADER:-X-Forwarded-For}'
      UPSTREAM_REAL_IP_RECURSIVE: '${UPSTREAM_REAL_IP_RECURSIVE:-off}'
      PROXY_READ_TIMEOUT: '${PROXY_READ_TIMEOUT:-120}'
      CLIENT_MAX_BODY_SIZE: '${CLIENT_MAX_BODY_SIZE:-50m}'
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'
  queue-long:
    image: 'frappe/erpnext:${FRAPPE_TAG:-v15.88.0}'
    command:
      - bench
      - worker
      - '--queue'
      - 'long,default,short'
    environment:
      FRAPPE_REDIS_CACHE: 'redis://redis-cache:6379'
      FRAPPE_REDIS_QUEUE: 'redis://redis-queue:6379'
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'
  queue-short:
    image: 'frappe/erpnext:${FRAPPE_TAG:-v15.88.0}'
    command:
      - bench
      - worker
      - '--queue'
      - 'short,default'
    environment:
      FRAPPE_REDIS_CACHE: 'redis://redis-cache:6379'
      FRAPPE_REDIS_QUEUE: 'redis://redis-queue:6379'
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'
  redis-queue:
    image: 'redis:${REDIS_TAG:-6.2-alpine}'
    volumes:
      - 'redis-queue-data:/data'
  redis-cache:
    image: 'redis:${REDIS_TAG:-6.2-alpine}'
  scheduler:
    image: 'frappe/erpnext:${FRAPPE_TAG:-v15.88.0}'
    command:
      - bench
      - schedule
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'
  websocket:
    image: 'frappe/erpnext:${FRAPPE_TAG:-v15.88.0}'
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_REDIS_CACHE: 'redis://redis-cache:6379'
      FRAPPE_REDIS_QUEUE: 'redis://redis-queue:6379'
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'
volumes:
  db-data: null
  redis-queue-data: null
  sites: null
  logs: null
